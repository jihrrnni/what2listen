<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日、何聴く？</title>
  <meta name="description" content="好きなアルバムを登録して、今日聴く一枚を決めてもらう小さなサイト。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">from My neighborhood</p>
      <h1>今日、何聴く？</h1>
      <p class="lead">好きなアルバムを登録しておくと、<br>今日はその中から一枚、勝手に決めてくれます。</p>
    </header>

    <section class="picker card">
      <p class="small">あなたの好きなアルバムから</p>
      <div id="result" class="result empty">
        <div class="placeholder">まだ選ばれていません</div>
      </div>
      <p id="message" class="message">今日は何を聴こうかな。</p>
      <button id="pickButton" class="primary">今日の一枚を決める</button>
      <a id="listenButton" class="listen hidden" target="_blank" rel="noopener">これを聴く ↗</a>
    </section>

    <section class="library card">
      <div class="section-head">
        <div>
          <p class="small">MY ALBUMS</p>
          <h2>好きなアルバム</h2>
        </div>
        <span id="count" class="count">0枚</span>
      </div>

      <form id="albumForm" class="form">
        <input id="artist" required placeholder="アーティスト名" aria-label="アーティスト名">
        <input id="title" required placeholder="アルバム名" aria-label="アルバム名">
        <input id="cover" placeholder="ジャケット画像URL（任意）" aria-label="ジャケット画像URL">
        <input id="url" type="url" placeholder="聴くためのURL（任意）" aria-label="聴くためのURL">
        <button type="submit" class="secondary">アルバムを追加</button>
      </form>

      <div id="albums" class="albums"></div>
      <p id="emptyText" class="empty-text">まだアルバムがありません。<br>自分の好きなものを、少しずつ入れてみてください。</p>
    </section>

    <footer>
      <p>好きなものが増えたら、選ぶのがちょっと難しくなった。</p>
      <p>だから今日は、決めてもらうことにしました。</p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
